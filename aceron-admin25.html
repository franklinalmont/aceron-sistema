<!--
=========================================================================
 ACERON · ADMINISTRACIÓN  (para ti y tu secretaria)
=========================================================================
 Este archivo es la mitad "admin" del sistema. Usa la MISMA base de
 Firebase que aceron-empleado.html — son dos interfaces, una sola nube.

 CONFIGURACIÓN — pega el mismo FIREBASE_CONFIG en AMBOS archivos
 (admin y empleado), es el mismo proyecto de Firebase para los dos.

 1) console.firebase.google.com → tu proyecto → Configuración → tus apps
    → copia firebaseConfig → pégalo abajo en FIREBASE_CONFIG.
 2) Activa: Authentication (correo/contraseña) y Firestore Database.
    (Storage NO hace falta — las fotos se guardan comprimidas dentro de
    Firestore mismo, así te quedas en el plan gratis sin tarjeta.)
 3) Reglas de Firestore (pestaña Reglas):

    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        function estaLogueado() { return request.auth != null; }
        function miDoc() { return get(/databases/$(database)/documents/users/$(request.auth.uid)); }
        function esAdmin() { return estaLogueado() && miDoc().data.role == 'admin'; }
        function esSecretariaConPermiso(p) {
          return estaLogueado() && miDoc().data.role == 'secretaria' && miDoc().data.permisos[p] == true;
        }
        match /users/{uid} {
          allow read: if estaLogueado();
          allow write: if esAdmin() || esSecretariaConPermiso('empleados');
        }
        match /proyectos/{id} {
          allow read: if estaLogueado();
          allow write: if esAdmin() || esSecretariaConPermiso('proyectos');
        }
        match /mobiliarios/{id} {
          allow read: if estaLogueado();
          allow write: if esAdmin() || esSecretariaConPermiso('proyectos');
        }
        match /trabajos/{id} {
          allow read: if estaLogueado();
          allow create: if estaLogueado();
          allow update, delete: if esAdmin() || esSecretariaConPermiso('proyectos');
        }
        match /materiales/{id} {
          allow read: if estaLogueado();
          allow create, update, delete: if esAdmin() || esSecretariaConPermiso('verMateriales');
        }
        match /puestos/{id} {
          allow read: if estaLogueado();
          allow write: if esAdmin();
        }
        match /prestamos/{id} {
          allow read: if estaLogueado() && (esAdmin() || request.auth.uid == resource.data.empleadoId);
          allow write: if esAdmin();
        }
        match /notificaciones/{id} {
          allow read: if estaLogueado();
          allow write: if esAdmin();
        }
      }
    }

 4) (OPCIONAL, no lo necesitas) Si en el futuro quieres fotos en mayor
    calidad y activas Storage con plan Blaze, estas serían sus reglas:
    rules_version = '2';
    service firebase.storage {
      match /b/{bucket}/o {
        match /fotos/{allPaths=**} {
          allow read: if request.auth != null;
          allow write: if request.auth != null;
        }
        match /empleados/{allPaths=**} {
          allow read: if request.auth != null;
          allow write: if request.auth != null;
        }
      }
    }

 5) PRIMER ADMIN: créalo a mano UNA sola vez en Firebase Console
    (Authentication → Add user) y luego un documento en Firestore,
    colección "users", ID = el UID generado, con:
    nombre (string), email (string), role (string) = "admin", activo (boolean) = true.
    De ahí en adelante, empleados y secretaria se crean desde este panel.

 MODO DEMO (mientras no conectas Firebase): entra con
 arq.franklinalm@gmail.com / 123456 — datos de ejemplo, no se guardan en la nube.
=========================================================================
-->

<style>
  :root{
    --bg: #0c0f13;
    --surface: #12161b;
    --panel: #171c22;
    --panel-2: #1c222a;
    --card-hover: #202832;
    --line: #262e37;
    --line-soft: #1d232b;
    --text: #f3f1ea;
    --muted: #8992a1;
    --amber: #4d8dff;
    --amber-deep: #2563eb;
    --amber-soft: rgba(77,141,255,0.16);
    --red: #ff6b6b;
    --red-soft: rgba(255,107,107,0.13);
    --green: #3ddc97;
    --green-soft: rgba(61,220,151,0.13);
    --blue: #6fb3ff;
    --blue-soft: rgba(111,179,255,0.13);
    --mono: 'JetBrains Mono', monospace;
    --head: 'Sora', sans-serif;
    --body: 'Inter', sans-serif;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(77,141,255,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(61,220,151,0.03), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:#ffffff;}
  a{color:var(--amber);}
  button{font-family:var(--body);cursor:pointer;}
  input,select,textarea{font-family:var(--body);}

  .plate{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    position:relative;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 14px 30px -18px rgba(0,0,0,0.65);
    transition:.18s ease;
  }
  .plate:hover{border-color:#333d48;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;border-bottom:1px solid var(--line);
    background:rgba(18,22,27,0.85);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-family:var(--head);font-weight:700;color:#ffffff;
    background:linear-gradient(135deg,#8ab4ff,var(--amber-deep));
    box-shadow:0 6px 16px -6px rgba(77,141,255,0.5);
  }
  .brand .mark span{font-size:16px;}
  .brand h1{font-family:var(--head);font-weight:700;letter-spacing:.2px;font-size:17px;margin:0;}
  .brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.6px;margin-top:1px;}
  .who{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);}
  .who b{color:var(--text);font-weight:600;}
  .tag-role{
    font-size:11px;font-weight:600;letter-spacing:.3px;padding:5px 11px;
    background:var(--amber-soft);color:var(--amber);border-radius:20px;
  }
  .btn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    padding:10px 18px;font-size:13px;font-weight:600;border-radius:var(--r-sm);transition:.15s;
  }
  .btn:hover{border-color:#3a4550;background:var(--card-hover);transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,#8ab4ff,var(--amber-deep));border-color:transparent;color:#ffffff;box-shadow:0 8px 20px -10px rgba(77,141,255,0.55);}
  .btn-primary:hover{filter:brightness(1.06);color:#ffffff;transform:translateY(-1px);}
  .btn-danger{border-color:rgba(255,107,107,0.35);color:var(--red);background:var(--red-soft);}
  .btn-danger:hover{background:var(--red);color:#1a0a0a;border-color:var(--red);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn-ghost:hover{color:var(--amber);background:var(--amber-soft);}
  .btn-sm{padding:6px 12px;font-size:11.5px;border-radius:8px;}

  .shell{display:flex;min-height:calc(100vh - 69px);}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface);padding:20px 14px;border-right:1px solid var(--line);}
  .sidebar button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    color:var(--muted);padding:11px 14px;margin-bottom:3px;font-size:13.5px;font-weight:600;
    border-radius:12px;transition:.15s;
  }
  .sidebar button:hover{color:var(--text);background:var(--panel-2);}
  .sidebar button.active{color:#ffffff;background:linear-gradient(135deg,#8ab4ff,var(--amber-deep));box-shadow:0 8px 18px -10px rgba(77,141,255,0.5);}
  .main{flex:1;padding:30px 34px;max-width:1240px;}
  .hidden{display:none !important;}

  h2.section-title{font-family:var(--head);font-weight:700;letter-spacing:-.2px;font-size:24px;margin:0 0 4px;}
  .section-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;}

  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(700px 400px at 50% 0%, rgba(77,141,255,0.09), transparent 60%),var(--bg);
  }
  .login-box{width:380px;padding:38px 34px 32px;}
  .login-box .brand{justify-content:center;margin-bottom:26px;}
  .login-box .brand h1{font-size:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin-bottom:7px;font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-size:14px;border-radius:var(--r-sm);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);}
  #login-error{color:var(--red);font-size:12.5px;margin:10px 0 0;min-height:16px;}
  .login-box .btn{width:100%;margin-top:8px;padding:13px;font-size:14px;border-radius:12px;}

  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .card{padding:20px;}
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card h3{font-family:var(--head);font-size:15.5px;font-weight:700;letter-spacing:0;margin:0 0 3px;}
  .muted{color:var(--muted);}
  .mono{font-family:var(--mono);}
  .amount{font-family:var(--mono);color:var(--amber);font-weight:700;font-size:15px;}

  .stat{padding:20px;}
  .stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .stat .val{font-family:var(--head);font-size:30px;font-weight:800;margin-top:6px;}
  .stat .val.amber{color:var(--amber);}
  .stat .val.green{color:var(--green);}
  .stat .val.blue{color:var(--blue);}

  .gauge{margin-top:14px;}
  .gauge-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:7px;font-family:var(--mono);}
  .gauge-track{height:9px;background:var(--surface);border-radius:20px;position:relative;overflow:hidden;}
  .gauge-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--amber-deep),var(--amber));transition:width .5s ease;box-shadow:0 0 10px rgba(77,141,255,0.35);}
  .gauge-fill.over{background:linear-gradient(90deg,#1f9d68,var(--green));box-shadow:0 0 10px rgba(61,220,151,0.35);}

  .empty{padding:36px;text-align:center;color:var(--muted);font-size:13.5px;border:1.5px dashed var(--line);border-radius:var(--r-lg);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;letter-spacing:.3px;font-weight:600;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 12px;}
  td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .pill{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;display:inline-block;}
  .pill.on{color:var(--green);background:var(--green-soft);}
  .pill.off{color:var(--red);background:var(--red-soft);}
  .pill.info{color:var(--blue);background:var(--blue-soft);}

  .thumb-row{display:flex;gap:7px;flex-wrap:wrap;}
  .thumb-row img{width:54px;height:54px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--line);transition:.15s;}
  .thumb-row img:hover{transform:scale(1.05);border-color:var(--amber);}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--panel-2);border:1px solid var(--line);padding:13px 20px;font-size:13px;border-radius:var(--r-sm);z-index:999;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);border-left:3px solid var(--amber);}
  .toast.err{border-left-color:var(--red);color:var(--red);}

  .modal-bg{position:fixed;inset:0;background:rgba(6,8,10,0.78);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;backdrop-filter:blur(3px);}
  .modal{width:480px;max-width:100%;padding:26px;max-height:85vh;overflow:auto;}
  .modal h3{margin-top:0;font-family:var(--head);}
  .close-x{position:absolute;top:14px;right:16px;background:var(--panel-2);border:none;color:var(--muted);font-size:15px;width:28px;height:28px;border-radius:9px;}
  .close-x:hover{color:var(--text);}
  .lightbox-img{max-width:90vw;max-height:85vh;border-radius:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,0.8);}

  .avatar{
    width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--head);font-weight:700;font-size:15px;color:#ffffff;
    background:linear-gradient(135deg,#8ab4ff,var(--amber-deep));flex-shrink:0;
  }
  .avatar.lg{width:60px;height:60px;font-size:19px;}
  .emp-card{display:flex;gap:14px;align-items:center;padding:18px;}
  .emp-card .info{flex:1;min-width:0;}
  .emp-card .info b{display:block;font-size:14.5px;}
  .emp-card .info span{font-size:12px;color:var(--muted);}
  .emp-meta{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted);}
  .emp-meta b{color:var(--text);font-family:var(--mono);}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:16px;background:none;border:none;}
  .back-link:hover{color:var(--amber);}

  .feed-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);}
  .feed-item:last-child{border-bottom:none;}
  .feed-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);margin-top:6px;flex-shrink:0;}
  .feed-dot.mat{background:var(--blue);}
  .feed-text{flex:1;font-size:13.5px;}
  .feed-text b{font-weight:600;}
  .feed-time{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px;}

  @media(max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;display:flex;overflow-x:auto;padding:10px;gap:4px;}
    .sidebar button{white-space:nowrap;padding:9px 14px;margin-bottom:0;}
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
    .main{padding:20px;}
  }
</style>
</head>

/* Comprime la foto y la convierte a base64 para guardarla directo en
   Firestore — así no hace falta Firebase Storage (ni tarjeta de pago). */
function comprimirImagenABase64(file, maxDim=500, calidad=0.7){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

/* ---------------- mock db para modo demo ---------------- */
function crearMockDb(){
  const store = { users: [], proyectos: [], trabajos: [], materiales: [], mobiliarios: [], prestamos: [], notificaciones: [], puestos: [] };
  const listeners = [];
  let seq = 1;
  const nextId = () => 'demo' + (seq++);
  function aplicaFiltros(items, filters){ return items.filter(it => filters.every(f => f.op==='==' ? it[f.field]===f.value : true)); }
  function ordena(items, order){
    if(!order) return items;
    const val = v => (v instanceof Date) ? v.getTime() : (v || 0);
    return [...items].sort((a,b) => (val(a[order.field]) - val(b[order.field])) * (order.dir === 'desc' ? -1 : 1));
  }
  function snapshotDe(builder){
    let items = store[builder.name].map(it => ({...it}));
    items = aplicaFiltros(items, builder.filters);
    items = ordena(items, builder.order);
    if(builder.lim) items = items.slice(0, builder.lim);
    const docs = items.map(it => ({ id: it.id, data: () => { const {id, ...rest} = it; return rest; } }));
    return { docs, forEach(fn){ docs.forEach(fn); } };
  }
  function notifica(name){ listeners.filter(l => l.name === name).forEach(l => l.cb(snapshotDe(l.builder))); }
  function nuevoBuilder(name, filters=[], order=null, lim=null){
    return {
      name, filters, order, lim,
      where(field, op, value){ return nuevoBuilder(name, [...filters, {field, op, value}], order, lim); },
      orderBy(field, dir='asc'){ return nuevoBuilder(name, filters, {field, dir}, lim); },
      limit(n){ return nuevoBuilder(name, filters, order, n); },
      get(){ return Promise.resolve(snapshotDe(this)); },
      onSnapshot(cb){ listeners.push({name, builder:this, cb}); cb(snapshotDe(this)); return () => {}; },
      add(data){ const id = nextId(); store[name].push({id, ...data}); notifica(name); return Promise.resolve(Object.assign(mockDoc(name,id), {id})); }
    };
  }
  function mockDoc(name, id){
    return {
      id,
      get(){ const f = store[name].find(it=>it.id===id); return Promise.resolve({exists:!!f, id, data:()=>{ if(!f) return undefined; const {id:_i,...r}=f; return r; }}); },
      set(data, opts){
        const idx = store[name].findIndex(it=>it.id===id);
        if(idx===-1) store[name].push({id,...data});
        else if(opts&&opts.merge) store[name][idx] = deepMerge(store[name][idx], data);
        else store[name][idx] = {id,...data};
        notifica(name); return Promise.resolve();
      },
      update(data){ const idx = store[name].findIndex(it=>it.id===id); if(idx!==-1) store[name][idx]={...store[name][idx],...data}; notifica(name); return Promise.resolve(); }
    };
  }
  function deepMerge(base, patch){
    const out = {...base};
    Object.keys(patch).forEach(k => {
      if(patch[k] && typeof patch[k]==='object' && !Array.isArray(patch[k]) && !(patch[k] instanceof Date)) out[k] = {...(base[k]||{}), ...patch[k]};
      else out[k] = patch[k];
    });
    return out;
  }
  return { collection(name){ return Object.assign(nuevoBuilder(name), {doc:(id)=>mockDoc(name,id)}); }, _store: store };
}

/* ---------------- login / logout ---------------- */
function hacerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Ingresa correo y contraseña.'; return; }

  if(email.toLowerCase() === DEMO_EMAIL && pass === DEMO_PASS){
    const mockDb = crearMockDb();
    sembrarDemo(mockDb);
    db = mockDb;
    DEMO_MODE = true;
    CURRENT_USER = {uid:'demo-admin', nombre:'Frank (modo demo)', email, role:'admin', activo:true};
    entrarApp();
    toast('Modo demo activo: datos de ejemplo, no se guardan en la nube.');
    return;
  }

  auth.signInWithEmailAndPassword(email, pass).catch(() => { errEl.textContent = 'Correo o contraseña incorrectos.'; });
}
function hacerLogout(){
  if(DEMO_MODE){
    DEMO_MODE = false; db = firebase.firestore(); CURRENT_USER = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-wrap').classList.remove('hidden');
    return;
  }
  auth.signOut();
}
function entrarApp(){
  document.getElementById('login-wrap').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who-name').textContent = CURRENT_USER.nombre || CURRENT_USER.email;
  document.getElementById('who-role').textContent = CURRENT_USER.role + (DEMO_MODE ? ' · demo' : '');
  iniciarPuestos();
  montarSidebar();
}

auth.onAuthStateChanged(async user => {
  if(DEMO_MODE) return;
  if(!user){
    CURRENT_USER = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-wrap').classList.remove('hidden');
    return;
  }
  const snap = await db.collection('users').doc(user.uid).get();
  if(!snap.exists || snap.data().activo === false){
    document.getElementById('login-error').textContent = 'Esta cuenta no existe o fue desactivada. Contacta al administrador.';
    auth.signOut();
    return;
  }
  const data = snap.data();
  if(data.role === 'empleado'){
    document.getElementById('login-error').textContent = 'Esta es una cuenta de empleado. Usa aceron-empleado.html para entrar.';
    auth.signOut();
    return;
  }
  CURRENT_USER = Object.assign({uid:user.uid}, data);
  entrarApp();
});

/* ---------------- sidebar / router ---------------- */
function montarSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  let items = [['inicio','Inicio'], ['proyectos','Proyectos'], ['extra','Trabajo extra'], ['materiales','Materiales']];
  if(CURRENT_USER.role === 'admin' || permOk('empleados')) items.push(['ajustes','Ajustes']);
  items.forEach((it) => {
    const b = document.createElement('button');
    b.textContent = it[1];
    b.onclick = () => irA(it[0]);
    b.dataset.view = it[0];
    sb.appendChild(b);
  });
  irA(items[0][0]);
}
function irA(view){
  VIEW = view;
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const renderers = { inicio: renderInicio, proyectos: renderProyectos, extra: renderTrabajoExtra, materiales: renderMaterialesView, ajustes: renderAjustes };
  (renderers[view] || (()=>{}))();
}

async function crearEmpleado(){
  const nombre = document.getElementById('e-nombre').value.trim();
  const email = document.getElementById('e-email').value.trim();
  const pass = document.getElementById('e-pass').value;
  const categoria = document.getElementById('e-categoria').value;

  if(!nombre || !email || pass.length < 6){ toast('Completa todos los campos (contraseña mín. 6 caracteres)', true); return; }
  try{
    let uid;
    if(DEMO_MODE){ uid = 'demo-emp-' + Date.now(); }
    else { const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, pass); uid = cred.user.uid; await secondaryApp.auth().signOut(); }
    let fotoUrl = '';
    if(fotoFile){
      fotoUrl = await comprimirImagenABase64(fotoFile);
    }
    await db.collection('users').doc(uid).set({ nombre, email, role: 'empleado', activo: true, categoria, fotoUrl, creadoEn: serverTs() });
    document.querySelector('.modal-bg')?.remove();
    toast('Empleado creado. Ya puede iniciar sesión en aceron-empleado.html.');

/* =====================================================================
   PROYECTOS — cada proyecto tiene una lista de mobiliarios
   (ej: "Mesa 1.20x0.60" cantidad 2). El avance se mide por mobiliario.
===================================================================== */
function renderProyectos(){
  const main = document.getElementById('main');
  const puedeEditar = permOk('proyectos');
  main.innerHTML = `<h2 class="section-title">Proyectos</h2><p class="section-sub">Cada proyecto tiene su lista de mobiliarios (tipo, medida y cantidad).</p>

    <div id="proyectos-list"></div>`;
  db.collection('proyectos').orderBy('creadoEn','desc').onSnapshot(async snap => {
    const [mobSnap, trabSnap] = await Promise.all([db.collection('mobiliarios').get(), db.collection('trabajos').get()]);
    const hechosPorMob = {};
    const __pf = puestoFinal(); trabSnap.docs.forEach(d=>{ const t=d.data(); if(t.mobiliarioId && __pf && t.etapa===__pf.id) hechosPorMob[t.mobiliarioId]=(hechosPorMob[t.mobiliarioId]||0)+Number(t.cantidad||0); });
    const mobPorProyecto = {};
    mobSnap.docs.forEach(d=>{ const m=d.data(); if(!mobPorProyecto[m.proyectoId]) mobPorProyecto[m.proyectoId]=[]; mobPorProyecto[m.proyectoId].push({id:d.id,...m}); });
    const rows = []; snap.forEach(d => rows.push({id:d.id, ...d.data()}));
    document.getElementById('proyectos-list').innerHTML = rows.length ? `<div class="grid grid-2">` + rows.map(p => {
      const mobs = mobPorProyecto[p.id] || [];
      const totalReq = mobs.reduce((s,m)=>s+(Number(m.cantidad)||0),0);
      const totalHecho = mobs.reduce((s,m)=>s+Math.min(hechosPorMob[m.id]||0, Number(m.cantidad)||0),0);
      const pct = totalReq ? Math.round((totalHecho/totalReq)*100) : 0;
      return `<div class="plate card">
        <div class="card-row"><h3>${p.nombre}</h3><span class="pill ${p.estado==='activo'?'on':'off'}">${p.estado}</span></div>
        <p class="muted" style="font-size:13px;">${p.descripcion||''}</p>
        <div class="gauge">
          <div class="gauge-top"><span>${totalHecho} de ${totalReq} piezas</span><span>${pct}%</span></div>
          <div class="gauge-track"><div class="gauge-fill ${pct>=100?'over':''}" style="width:${Math.min(100,pct)}%"></div></div>
        </div>
        <button class="btn btn-sm" style="margin-top:14px;" onclick="renderDetalleProyecto('${p.id}')">Ver mobiliarios</button>
      </div>`;
    }).join('') + `</div>` : '<div class="empty">No hay proyectos. Crea el primero.</div>';
  });
}
function abrirModalProyecto(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="plate modal">
    <button class="close-x" onclick="this.closest('.modal-bg').remove()">✕</button>
    <h3>Nuevo proyecto</h3>
    <div class="field"><label>Nombre del proyecto</label><input id="p-nombre" placeholder="Ej: Cocina Musa"></div>
    <div class="field"><label>Descripción</label><textarea id="p-desc" rows="2"></textarea></div>
    <label style="display:block;font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin-bottom:8px;font-weight:600;">Mobiliarios de este proyecto</label>
    <div id="mob-rows"></div>
    <button type="button" class="btn btn-sm" style="margin:6px 0 16px;" onclick="agregarFilaMobiliario()">+ Agregar mobiliario</button>
    <button class="btn btn-primary" onclick="guardarProyectoNuevo()">Guardar proyecto</button>
  </div>`;
  document.body.appendChild(bg);
  agregarFilaMobiliario();
}
function agregarFilaMobiliario(tipo, medida, cantidad){
  const cont = document.getElementById('mob-rows');
  const row = document.createElement('div');
  row.className = 'mob-row';
  row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center;';
  row.innerHTML = `
    <input class="mob-tipo" placeholder="Ej: Mesa" value="${tipo||''}" style="flex:2;padding:10px 12px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);font-size:13px;">
    <input class="mob-medida" placeholder="Ej: 1.20 x 0.60" value="${medida||''}" style="flex:2;padding:10px 12px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);font-size:13px;">
    <input class="mob-cant" type="number" placeholder="Cant." value="${cantidad||''}" style="width:70px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);font-size:13px;">
    <button type="button" class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">✕</button>`;
  cont.appendChild(row);
}
async function guardarProyectoNuevo(){
  const nombre = document.getElementById('p-nombre').value.trim();
  const descripcion = document.getElementById('p-desc').value.trim();
  if(!nombre){ toast('Ponle nombre al proyecto', true); return; }
  const filas = [...document.querySelectorAll('#mob-rows .mob-row')].map(r => ({
    tipo: r.querySelector('.mob-tipo').value.trim(),
    medida: r.querySelector('.mob-medida').value.trim(),
    cantidad: parseInt(r.querySelector('.mob-cant').value) || 0
  })).filter(f => f.tipo && f.cantidad > 0);
  const proyRef = await db.collection('proyectos').add({ nombre, descripcion, estado:'activo', creadoEn: serverTs() });
  for(const f of filas){
    await db.collection('mobiliarios').add({ proyectoId: proyRef.id, proyectoNombre: nombre, tipo: f.tipo, medida: f.medida, cantidad: f.cantidad, urgente:false, creadoEn: serverTs() });
  }
  document.querySelector('.modal-bg')?.remove();
  toast('Proyecto y mobiliarios guardados.');
}
async function renderDetalleProyecto(proyectoId){
  const main = document.getElementById('main');
  main.innerHTML = `<button class="back-link" onclick="irA('proyectos')">← Volver a proyectos</button><div id="detalle-body">Cargando...</div>`;
  const puedeEditar = permOk('proyectos');
  const [proySnap, mobSnap, trabSnap] = await Promise.all([
    db.collection('proyectos').doc(proyectoId).get(),
    db.collection('mobiliarios').where('proyectoId','==',proyectoId).get(),
    db.collection('trabajos').where('proyectoId','==',proyectoId).get()
  ]);
  if(!proySnap.exists){ document.getElementById('detalle-body').innerHTML = '<div class="empty">Proyecto no encontrado.</div>'; return; }
  const p = proySnap.data();
  const hechosPorMob = {};
  const __pf = puestoFinal(); trabSnap.docs.forEach(d=>{ const t=d.data(); if(t.mobiliarioId && __pf && t.etapa===__pf.id) hechosPorMob[t.mobiliarioId]=(hechosPorMob[t.mobiliarioId]||0)+Number(t.cantidad||0); });
  const mobs = mobSnap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('detalle-body').innerHTML = `
    <h2 class="section-title">${p.nombre}</h2>
    <p class="section-sub">${p.descripcion||''}</p>
    <div class="card-row" style="margin-bottom:18px;">
      <h3 style="font-family:var(--head);font-size:16px;">Mobiliarios</h3>
      ${puedeEditar ? `<button class="btn btn-sm" onclick="abrirModalNuevoMobiliario('${proyectoId}','${p.nombre.replace(/'/g,"&apos;")}')">+ Agregar mobiliario</button>` : ''}
    </div>
    <div class="grid grid-2">
      ${mobs.length ? mobs.map(m => {
        const hecho = Math.min(hechosPorMob[m.id]||0, m.cantidad);
        const pct = m.cantidad ? Math.round((hecho/m.cantidad)*100) : 0;
        return `<div class="plate card" style="${m.urgente?'border-color:rgba(255,107,107,0.5);':''}">
          <div class="card-row"><h3>${m.tipo}${m.medida ? ' · '+m.medida : ''}</h3>${m.urgente ? '<span class="pill off">Urgente</span>' : ''}</div>
          <div class="gauge">
            <div class="gauge-top"><span>${hecho} de ${m.cantidad} hechas</span><span>${pct}%</span></div>
            <div class="gauge-track"><div class="gauge-fill ${pct>=100?'over':''}" style="width:${Math.min(100,pct)}%"></div></div>
          </div>
          ${puedeEditar ? `<button class="btn btn-sm ${m.urgente?'':'btn-danger'}" style="margin-top:12px;" onclick="toggleUrgenteMobiliario('${m.id}', ${!m.urgente}, '${proyectoId}')">${m.urgente?'Quitar urgente':'Marcar urgente'}</button>` : ''}
        </div>`;
      }).join('') : '<div class="empty">Este proyecto no tiene mobiliarios cargados todavía.</div>'}
    </div>`;
}
async function toggleUrgenteMobiliario(mobId, valor, proyectoId){
  await db.collection('mobiliarios').doc(mobId).update({urgente: valor});
  toast(valor ? 'Marcado como urgente.' : 'Ya no está marcado como urgente.');
  renderDetalleProyecto(proyectoId);
}
function abrirModalNuevoMobiliario(proyectoId, proyectoNombre){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="plate modal">
    <button class="close-x" onclick="this.closest('.modal-bg').remove()">✕</button>
    <h3>Nuevo mobiliario</h3>
    <div class="field"><label>Tipo</label><input id="nm-tipo" placeholder="Ej: Mesa"></div>
    <div class="field"><label>Medida</label><input id="nm-medida" placeholder="Ej: 1.20 x 0.60"></div>
    <div class="field"><label>Cantidad</label><input id="nm-cant" type="number" placeholder="Ej: 2"></div>
    <button class="btn btn-primary" onclick="guardarNuevoMobiliario('${proyectoId}','${proyectoNombre}')">Guardar</button>
  </div>`;
  document.body.appendChild(bg);
}
async function guardarNuevoMobiliario(proyectoId, proyectoNombre){
  const tipo = document.getElementById('nm-tipo').value.trim();
  const medida = document.getElementById('nm-medida').value.trim();
  const cantidad = parseInt(document.getElementById('nm-cant').value) || 0;
  if(!tipo || cantidad <= 0){ toast('Completa tipo y cantidad', true); return; }
  await db.collection('mobiliarios').add({ proyectoId, proyectoNombre, tipo, medida, cantidad, urgente:false, creadoEn: serverTs() });
  document.querySelector('.modal-bg')?.remove();
  toast('Mobiliario agregado.');
  renderDetalleProyecto(proyectoId);
}

/* =====================================================================
   MATERIALES — el admin/secretaria le entrega el material al empleado
   para que termine el trabajo. Queda quién lo recibió, en qué
   proyecto, día y hora.
===================================================================== */
async function renderMaterialesView(){
  const main = document.getElementById('main');
  main.innerHTML = `<h2 class="section-title">Materiales</h2><p class="section-sub">Registra el material que le entregas a cada empleado para terminar su trabajo.</p><div id="mat-body"></div>`;
  if(!permOk('verMateriales')){ document.getElementById('mat-body').innerHTML = '<div class="empty">No tienes permiso para ver esta sección.</div>'; return; }

  const [empSnap, proySnap] = await Promise.all([
    db.collection('users').where('role','==','empleado').get(),
    db.collection('proyectos').where('estado','==','activo').get()
  ]);
  const opcEmp = empSnap.docs.filter(d=>d.data().activo!==false).map(d => `<option value="${d.id}" data-nombre="${d.data().nombre}">${d.data().nombre}</option>`).join('');
  const opcProy = proySnap.docs.map(d => `<option value="${d.id}">${d.data().nombre}</option>`).join('');

  document.getElementById('mat-body').innerHTML = `
    <div class="plate card" style="max-width:520px;margin-bottom:22px;">
      <h3 style="margin-bottom:14px;">Entregar material</h3>
      <div class="field"><label>Empleado</label><select id="mt-empleado">${opcEmp || '<option value="">No hay empleados activos</option>'}</select></div>
      <div class="field"><label>Proyecto</label><select id="mt-proyecto">${opcProy || '<option value="">No hay proyectos activos</option>'}</select></div>
      <div class="field"><label>Material</label><input type="text" id="mt-material" placeholder="Ej: Lámina de acero inoxidable 4x8"></div>
      <div class="field"><label>Cantidad</label><input type="text" id="mt-cantidad" placeholder="Ej: 2 láminas"></div>
      <button class="btn btn-primary" onclick="entregarMaterial()">Registrar entrega</button>
    </div>
    <div id="mat-tabla"></div>`;

  db.collection('materiales').orderBy('creadoEn','desc').limit(200).onSnapshot(snap => {
    const rows = []; snap.forEach(d=>rows.push(d.data()));
    document.getElementById('mat-tabla').innerHTML = rows.length ? `<div class="plate card"><table><thead><tr><th>Empleado</th><th>Proyecto</th><th>Material</th><th>Cant.</th><th>Día y hora</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.empleadoNombre}</td><td>${r.proyectoNombre}</td><td>${r.material}</td><td>${r.cantidad}</td><td class="mono">${fmtFechaHora(r.creadoEn)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Todavía no has entregado materiales.</div>';
  });
}
async function entregarMaterial(){
  const empSel = document.getElementById('mt-empleado');
  const proySel = document.getElementById('mt-proyecto');
  const empleadoId = empSel.value;
  const empleadoNombre = empSel.selectedOptions[0]?.dataset.nombre || '';
  const proyectoId = proySel.value;
  const proyectoNombre = proySel.selectedOptions[0]?.textContent || '';
  const material = document.getElementById('mt-material').value.trim();
  const cantidad = document.getElementById('mt-cantidad').value.trim();
  if(!empleadoId || !proyectoId || !material || !cantidad){ toast('Completa todos los campos', true); return; }
  await db.collection('materiales').add({
    proyectoId, proyectoNombre, material, cantidad, empleadoId, empleadoNombre,
    creadoEn: serverTs()
  });
  document.getElementById('mt-material').value = '';
  document.getElementById('mt-cantidad').value = '';
  toast('Material entregado y registrado.');
}

/* =====================================================================
   AJUSTES — empleados (crear/desactivar) y permisos de la secretaria
===================================================================== */
function abrirModalPuesto(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="plate modal">
    <button class="close-x" onclick="this.closest('.modal-bg').remove()">✕</button>
    <h3>Nuevo puesto</h3>
    <p class="section-sub">Se agrega al final de la línea de producción.</p>
    <div class="field"><label>Nombre</label><input id="pu-nombre" placeholder="Ej: Cortador"></div>
    <div class="field"><label>Ícono (emoji)</label><input id="pu-icono" placeholder="Ej: ✂️" maxlength="4"></div>
    <button class="btn btn-primary" onclick="guardarPuesto()">Guardar puesto</button>
  </div>`;
  document.body.appendChild(bg);
}
async function guardarPuesto(){
  const nombre = document.getElementById('pu-nombre').value.trim();
  const icono = document.getElementById('pu-icono').value.trim() || '🔧';
  if(!nombre){ toast('Ponle nombre al puesto', true); return; }
  const actuales = window.__PUESTOS_ORDENADOS || [];
  const orden = actuales.length ? Math.max(...actuales.map(p=>p.orden||0)) + 1 : 1;
  await db.collection('puestos').add({ nombre, icono, orden, creadoEn: serverTs() });
  document.querySelector('.modal-bg')?.remove();
  toast('Puesto agregado.');
}
async function moverPuesto(idx, dir){
  const rows = window.__PUESTOS_ORDENADOS || [];
  const otro = rows[idx+dir];
  const actual = rows[idx];
  if(!otro || !actual) return;
  const ordenActual = actual.orden, ordenOtro = otro.orden;
  await db.collection('puestos').doc(actual.id).update({orden: ordenOtro});
  await db.collection('puestos').doc(otro.id).update({orden: ordenActual});
}
function renderAjustes(){
  const main = document.getElementById('main');
  const puedeEmpleados = permOk('empleados');
  main.innerHTML = `<h2 class="section-title">Ajustes</h2><p class="section-sub">Cuentas de empleados, puestos de trabajo, notificaciones y permisos de la secretaria.</p>
    ${CURRENT_USER.role === 'admin' ? '<div id="ajustes-puestos" style="margin-bottom:30px;"></div>' : ''}
    <div id="ajustes-empleados" style="margin-bottom:30px;"></div>
    ${CURRENT_USER.role === 'admin' ? '<div id="ajustes-notif" style="margin-bottom:30px;"></div>' : ''}
    ${CURRENT_USER.role === 'admin' ? '<div id="ajustes-secretaria"></div>' : ''}`;

  if(CURRENT_USER.role === 'admin'){
    document.getElementById('ajustes-puestos').innerHTML = `
      <div class="card-row" style="margin-bottom:14px;"><h3 style="font-family:var(--head);font-size:16px;">Puestos de trabajo</h3><button class="btn btn-primary btn-sm" onclick="abrirModalPuesto()">+ Agregar puesto</button></div>
      <p class="muted" style="font-size:12.5px;margin:-8px 0 14px;">El orden de arriba hacia abajo es el orden de la línea de producción: cada puesto ve las piezas que ya pasaron por el de arriba.</p>
      <div id="puestos-list"></div>`;
    db.collection('puestos').orderBy('orden').onSnapshot(snap => {
      const rows = []; snap.forEach(d=>rows.push({id:d.id,...d.data()}));
      document.getElementById('puestos-list').innerHTML = rows.length ? `<div class="plate card">` + rows.map((p,i) => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i<rows.length-1?'border-bottom:1px solid var(--line-soft);':''}">
          <span class="mono muted" style="width:20px;">${i+1}</span>
          <span style="flex:1;font-size:14px;">${p.icono||'🔧'} ${p.nombre}</span>
          <button class="btn btn-sm" ${i===0?'disabled style="opacity:.35;"':''} onclick="moverPuesto(${i},-1)">↑</button>
          <button class="btn btn-sm" ${i===rows.length-1?'disabled style="opacity:.35;"':''} onclick="moverPuesto(${i},1)">↓</button>
        </div>`).join('') + `</div>` : '<div class="empty">No hay puestos creados. Agrega el primero (ej. "Doblador").</div>';
      window.__PUESTOS_ORDENADOS = rows;
    });
  }

  if(puedeEmpleados){
    document.getElementById('ajustes-empleados').innerHTML = `
      <div class="card-row" style="margin-bottom:14px;"><h3 style="font-family:var(--head);font-size:16px;">Empleados</h3><button class="btn btn-primary btn-sm" onclick="abrirModalEmpleado()">+ Nuevo empleado</button></div>
      <div id="ajustes-emp-list"></div>`;
    db.collection('users').where('role','==','empleado').onSnapshot(snap => {
      const rows = []; snap.forEach(d=>rows.push({id:d.id,...d.data()}));
      document.getElementById('ajustes-emp-list').innerHTML = rows.length ? `<div class="plate card"><table><thead><tr><th></th><th>Nombre</th><th>Categoría</th><th>Estado</th><th></th></tr></thead><tbody>
      ${rows.map(u => `<tr>
        <td>${avatarEmpleado(u)}</td>
        <td>${u.nombre}<br><span class="muted mono" style="font-size:11px;">${u.email}</span></td>
        <td>${badgeCategoria(u.categoria)}</td>
        <td><span class="pill ${u.activo!==false?'on':'off'}">${u.activo!==false?'Activo':'Inactivo'}</span></td>
        <td><button class="btn btn-sm ${u.activo!==false?'btn-danger':''}" onclick="toggleEmpleado('${u.id}', ${u.activo===false})">${u.activo!==false?'Desactivar':'Reactivar'}</button></td>
      </tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No hay empleados registrados aún.</div>';
    });
  }

  if(CURRENT_USER.role === 'admin'){
    document.getElementById('ajustes-notif').innerHTML = `
      <h3 style="font-family:var(--head);font-size:16px;margin-bottom:14px;">Enviar notificación</h3>
      <div class="plate card" style="max-width:480px;">
        <div class="field"><label>Para</label>
          <select id="nt-destino"><option value="">Todos los empleados</option></select>
        </div>
        <div class="field"><label>Mensaje</label><textarea id="nt-texto" rows="3" placeholder="Escribe el mensaje..."></textarea></div>
        <button class="btn btn-primary" onclick="enviarNotificacion()">Enviar</button>
      </div>`;
    db.collection('users').where('role','==','empleado').get().then(snap => {
      const sel = document.getElementById('nt-destino');
      snap.docs.forEach(d => { const o = document.createElement('option'); o.value = d.id; o.textContent = d.data().nombre; sel.appendChild(o); });
    });

    document.getElementById('ajustes-secretaria').innerHTML = `
      <div class="card-row" style="margin-bottom:14px;"><h3 style="font-family:var(--head);font-size:16px;">Secretaria y permisos</h3><button class="btn btn-primary btn-sm" onclick="abrirModalSecretaria()">+ Nueva secretaria</button></div>
      <div id="sec-list"></div>`;
    db.collection('users').where('role','==','secretaria').onSnapshot(snap => {
      const rows = []; snap.forEach(d=>rows.push({id:d.id,...d.data()}));
      document.getElementById('sec-list').innerHTML = rows.length ? rows.map(u => `
        <div class="plate card" style="margin-bottom:14px;">
          <div class="card-row">
            <div style="display:flex;gap:12px;align-items:center;"><div class="avatar">${iniciales(u.nombre)}</div><div><h3>${u.nombre}</h3><div class="muted mono" style="font-size:12px;">${u.email}</div></div></div>
            <span class="pill ${u.activo!==false?'on':'off'}">${u.activo!==false?'Activa':'Inactiva'}</span>
          </div>
          <div style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;">
            ${['empleados','proyectos','verMontos','verMateriales'].map(p => `
              <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;">
                <input type="checkbox" ${u.permisos?.[p]?'checked':''} onchange="cambiarPermiso('${u.id}','${p}',this.checked)"> ${etiquetaPermiso(p)}
              </label>`).join('')}
          </div>
          <button class="btn btn-sm ${u.activo!==false?'btn-danger':''}" style="margin-top:14px;" onclick="toggleEmpleado('${u.id}', ${u.activo===false})">${u.activo!==false?'Desactivar':'Reactivar'}</button>
        </div>`).join('') : '<div class="empty">No has creado ninguna secretaria todavía.</div>';
    });
  }
}
async function enviarNotificacion(){
  const empleadoId = document.getElementById('nt-destino').value;
  const empleadoNombre = empleadoId ? document.getElementById('nt-destino').selectedOptions[0].textContent : '';
  const texto = document.getElementById('nt-texto').value.trim();
  if(!texto){ toast('Escribe un mensaje', true); return; }
  await db.collection('notificaciones').add({ empleadoId: empleadoId || '', empleadoNombre, texto, creadoEn: serverTs() });
  document.getElementById('nt-texto').value = '';
  toast(empleadoId ? `Mensaje enviado a ${empleadoNombre}.` : 'Mensaje enviado a todos los empleados.');
}
function etiquetaPermiso(p){
  return { empleados:'Gestionar empleados', proyectos:'Gestionar proyectos', verMontos:'Ver montos', verMateriales:'Ver materiales' }[p] || p;
}
async function cambiarPermiso(uid, permiso, valor){
  await db.collection('users').doc(uid).set({permisos: {[permiso]: valor}}, {merge:true});
  toast('Permiso actualizado.');
}
function abrirModalSecretaria(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="plate modal">
    <button class="close-x" onclick="this.closest('.modal-bg').remove()">✕</button>
    <h3>Nueva secretaria</h3>
    <div class="field"><label>Nombre completo</label><input id="s-nombre"></div>
    <div class="field"><label>Correo</label><input id="s-email" type="email"></div>
    <div class="field"><label>Contraseña temporal</label><input id="s-pass" type="text" placeholder="mín. 6 caracteres"></div>
    <button class="btn btn-primary" onclick="crearSecretaria()">Crear cuenta</button>
  </div>`;
  document.body.appendChild(bg);
}
async function crearSecretaria(){
  const nombre = document.getElementById('s-nombre').value.trim();
  const email = document.getElementById('s-email').value.trim();
  const pass = document.getElementById('s-pass').value;
  if(!nombre || !email || pass.length < 6){ toast('Completa todos los campos (contraseña mín. 6 caracteres)', true); return; }
  try{
    let uid;
    if(DEMO_MODE){ uid = 'demo-sec-' + Date.now(); }
    else { const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, pass); uid = cred.user.uid; await secondaryApp.auth().signOut(); }
    await db.collection('users').doc(uid).set({
      nombre, email, role: 'secretaria', activo: true,
      permisos: {empleados:false, proyectos:false, verMontos:false, verMateriales:false},
      creadoEn: serverTs()
    });
    document.querySelector('.modal-bg')?.remove();
    toast('Secretaria creada. Asigna sus permisos abajo.');
  }catch(e){ toast('Error: ' + e.message, true); }
}
</script>
